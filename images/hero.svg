<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="hephaestus - Hephaestus the Greek god of the forge hammering a GPU-die anvil beneath a roofline curve">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1206"/>
      <stop offset="1" stop-color="#0c0a08"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffcf5c"/>
      <stop offset="0.5" stop-color="#ff8a2a"/>
      <stop offset="1" stop-color="#e5431f"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8813f"/>
      <stop offset="1" stop-color="#8a4e22"/>
    </linearGradient>
    <linearGradient id="die" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b6f6a"/>
      <stop offset="1" stop-color="#123f3c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a2a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="480" fill="url(#bg)"/>

  <!-- forge glow behind the anvil -->
  <ellipse cx="560" cy="300" rx="380" ry="160" fill="url(#glow)"/>

  <!-- roofline curve: memory-bound ramp then compute-bound ceiling -->
  <polyline points="170,360 420,220 790,150 1030,150" fill="none" stroke="url(#fire)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <text x="1040" y="145" font-family="monospace" font-size="20" fill="#ffcf5c">roofline</text>

  <!-- anvil (GPU die) -->
  <g transform="translate(470,320)">
    <rect x="0" y="0" width="240" height="70" rx="8" fill="url(#die)" stroke="#0a2523" stroke-width="3"/>
    <g stroke="#0a2523" stroke-width="2" opacity="0.55">
      <line x1="30" y1="0" x2="30" y2="70"/>
      <line x1="70" y1="0" x2="70" y2="70"/>
      <line x1="110" y1="0" x2="110" y2="70"/>
      <line x1="150" y1="0" x2="150" y2="70"/>
      <line x1="190" y1="0" x2="190" y2="70"/>
    </g>
    <rect x="70" y="-14" width="100" height="16" rx="4" fill="#153f3c" stroke="#0a2523" stroke-width="2"/>
    <g fill="#ffcf5c">
      <circle cx="120" cy="-20" r="3"/>
      <circle cx="140" cy="-28" r="2"/>
      <circle cx="104" cy="-30" r="2.5"/>
      <circle cx="128" cy="-38" r="2"/>
    </g>
  </g>

  <!-- Hephaestus, the god of the forge: bearded smith swinging a hammer -->
  <g transform="translate(430,150)">
    <path d="M120,150 L108,205 L96,205 L112,150 Z" fill="url(#skin)"/>
    <path d="M150,150 L156,205 L172,205 L166,150 Z" fill="url(#skin)"/>
    <path d="M96,74 C96,60 176,60 176,74 L184,150 L88,150 Z" fill="#7a2a12" stroke="#4d1a0b" stroke-width="2"/>
    <path d="M108,86 L164,86 L172,146 L100,146 Z" fill="#5a3418" stroke="#3a2110" stroke-width="2"/>
    <path d="M170,92 C205,86 235,70 250,52" fill="none" stroke="url(#skin)" stroke-width="14" stroke-linecap="round"/>
    <path d="M100,94 C80,104 70,120 74,138" fill="none" stroke="url(#skin)" stroke-width="13" stroke-linecap="round"/>
    <circle cx="136" cy="46" r="26" fill="url(#skin)"/>
    <path d="M114,52 C118,86 154,86 158,52 C158,74 148,84 136,84 C124,84 114,74 114,52 Z" fill="#3a2110"/>
    <circle cx="128" cy="42" r="3.5" fill="#1a1206"/>
    <path d="M112,30 Q136,16 160,30" fill="none" stroke="#c9a35a" stroke-width="4"/>
    <g stroke="#6b4a25" stroke-width="9" stroke-linecap="round">
      <line x1="250" y1="52" x2="196" y2="150"/>
    </g>
    <rect x="232" y="30" width="56" height="34" rx="6" transform="rotate(28 260 47)" fill="#8f9099" stroke="#4a4b52" stroke-width="3"/>
  </g>

  <!-- wordmark -->
  <text x="600" y="432" text-anchor="middle" font-family="Georgia, serif" font-size="56" fill="#ffcf5c" letter-spacing="2">hephaestus</text>
  <text x="600" y="463" text-anchor="middle" font-family="monospace" font-size="18" fill="#c9a35a">forge the kernel, test the metal, remember what it cost</text>
</svg>
