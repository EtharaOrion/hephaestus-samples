schema: forge.grounding/v4
bundle_family: moe_fused_experts_relu2_glu_moe_fwdbwd
identity:
  anchor_kind: torch_cublas_composition
  anchor_symbol: torch._grouped_mm
  anchor_note: 'Denominator = a cuBLAS grouped-GEMM composition on expert-sorted tokens

    with an EAGER ReLU^2 gate: stable argsort of routing slots by expert,

    torch._grouped_mm for both expert GEMM stages, eager `relu(gu[:, :F])^2

    * gu[:, F:]` for the gate product, weighted index_add combine, fwd+bwd

    through native autograd (taskdef._anchor_grouped). The GEMMs are cuBLAS

    (real tuned vendor library) and dominate device time; the ReLU^2

    epilogue is the anchor''s Achilles heel. Re-measure the anchor vs an

    expert-loop cuBLAS alternative per graded cell on the delivery image.'
  role: denominator and nothing else. The anchor is available to the verifier for timing. It is never
    the edit surface, and the agent may read it but may not call it.
  sota_repository: torch._grouped_mm
  sota_commit: not pinned; the anchor is a library symbol, not a checkout
  sota_commit_utc: '2025-01-01T00:00:00Z'
  train_cutoff: '2025-01-01'
  license: upstream license of the anchor library
task:
  editable: kernel.py
  reference: reference.py
  agent_visible:
  - instruction.md
  - kernel.py
  - reference.py
  - bench.py
  surface: forward_backward
  objective: implement relu2_glu_moe in kernel.py for the H100 and get as close as possible to the speed
    of the production anchor, without changing what it computes.
discovery:
  note: >-
    FORGE.md 10a.1. Graded values a solver can obtain only by running against the built
    environment. Each appears in this file, is established in the container at grade time,
    and is absent from the bound statement_closure verbatim and as paraphrase. recompute.py
    derives each from its grounding source, never from a statement literal.
  values:
    - name: target_fraction_of_sota
      grounding_source: grading.target_fraction_of_sota
      environment_state: tests/target.json
      absent_from_closure: true
      obtained_by: >-
        measuring the candidate against the production anchor on the graded cells; the pass
        bar is never stated, so a solver learns where it stands only by being graded
    - name: starter_fraction_of_sota
      grounding_source: grading.starter_fraction_of_sota
      environment_state: tests/target.json
      absent_from_closure: true
      obtained_by: >-
        grading the shipped starter; the statement says the starter is suboptimal but never
        by how much, so the headroom is discovered rather than read
    - name: graded_shape_set
      grounding_source: grading.definition
      environment_state: tests/hidden_shapes.json
      absent_from_closure: true
      obtained_by: >-
        empirical probing across shape and dtype; the statement says timing runs on hidden
        shapes but names none, so which cells dominate the geomean is discovered
    - name: anchor_device_time
      grounding_source: identity.anchor_symbol
      environment_state: tests/target.json
      absent_from_closure: true
      obtained_by: >-
        timing the production anchor in the graded environment; the anchor is readable but
        its measured device time on this host is not stated
forbidden_symbols:
- torch._grouped_mm
- _grouped_mm
- grouped_mm
- fused_moe
- vllm
- sglang
- grouped_gemm
- transformer_engine
- cutlass
- flashinfer
shapes:
  seed_base: 82103
  published: {}
  published_note: the published shapes are what bench.py times and are deliberately not the graded set.
    The graded shapes, scales and value distributions stay hidden, so a candidate tuned only to what it
    can see does not transfer.
  graded:
    g1:
      T: 8192
      D: 2048
      F: 1408
      E: 64
      A: 4
      dtypes:
      - bfloat16
      - float32
    g2:
      T: 4096
      D: 2048
      F: 1024
      E: 128
      A: 8
      dtypes:
      - bfloat16
      - float32
    g3:
      T: 16384
      D: 1024
      F: 2816
      E: 32
      A: 2
      dtypes:
      - bfloat16
      - float32
  correctness_only:
    c1:
      T: 3001
      D: 1000
      F: 704
      E: 17
      A: 3
      dtypes:
      - bfloat16
      - float32
    c2:
      T: 64
      D: 256
      F: 128
      E: 4
      A: 1
      dtypes:
      - bfloat16
      - float32
    c3:
      T: 4096
      D: 1024
      F: 704
      E: 64
      A: 4
      route_mode: collapse
      dtypes:
      - bfloat16
      - float32
    c4:
      T: 1024
      D: 999
      F: 513
      E: 33
      A: 2
      dtypes:
      - bfloat16
      - float32
grading:
  metric: fraction_of_sota
  definition: per graded shape r = t_anchor / t_candidate clipped into [0, 1]; R is the geometric mean
    of r; the score is R relative to the target and is zero unless every gate passes.
  target_fraction_of_sota: 0.7
  starter_fraction_of_sota: 0.092158
  frontier_defeat_floor_S: 0.15
  written_kernel_adoption_floor: 0.6
  adoption_floor: 0.6
  tolerances:
    bfloat16:
      atol: 18.0
      rtol: 0.1
    float32:
      atol: 5.0
      rtol: 0.02
  exactness: within dtype tolerance
oracle:
  path: solution/oracle_kernel.py
  strategy: independent_reimplementation
  reaches_full_reward: true
  role: the private oracle establishes that the full-reward point of the metric is reachable on this hardware.
    It is never shipped to the agent.
distribution_invariance:
  rule: the checked draw and the timed draw are the same draw
  why: a candidate that could tell the correctness distribution from the timed one could be correct on
    one and fast on the other.
environment:
  base_image: nvidia/cuda:12.8.0-devel-ubuntu24.04@sha256:813c3b834aaafe2df2891f9a840c412a4df3c073dd9e0ac75aab810ed82a5b48
  triton_floor: 3.7.1
  triton_floor_reason: measured on this host. Below this floor the graded denominator does not run correctly
    on Hopper, which makes the bundle ungradable rather than merely slower.
  network: no-network
  single_h100: true
  harbor_enum_note: Harbor's TaskConfig accepts exactly no-network, public or allowlist; the literal string
    full-internet is rejected at task load.
checkers:
  G0:
    name: trusted_entrypoint
    verifies: the submitted module imports and exposes relu2_glu_moe. A candidate that calls sys.exit
      during import is trapped rather than terminating the grader.
  G1:
    name: forbidden_symbols
    verifies: the submission neither imports nor calls the production kernel or any equivalent library
      implementation, scanned over the source with comments stripped so that citing a symbol stays legal
      and calling it does not.
  G2:
    name: correctness
    verifies: the output and all input gradients agrees with reference.py on every hidden configuration,
      on the same randomly scaled draw that is timed, so no branch can tell the checked distribution from
      the timed one.
  G3:
    name: speed
    verifies: the candidate is timed against the anchor on the graded shapes under a locked clock, and
      the geometric mean of the per-shape ratios becomes the score.
  G4:
    name: written_kernel
    verifies: the share of device time spent in the candidate's OWN kernels clears the adoption floor,
      so a submission that delegates the work elsewhere cannot claim the result.
negative_controls:
- id: NC1
  name: unmodified_starter
  expect: score well below target; the starter is the deliberately sub-optimal implementation
- id: NC2
  name: library_call
  detail: submission imports or calls the production kernel
  rejected_by: G1
  expect: score exactly 0.0
- id: NC3
  name: fast_and_wrong
  detail: accumulation precision dropped to buy speed
  rejected_by: G2
  expect: score exactly 0.0
- id: NC4
  name: delegated_work
  detail: the timed region runs in someone else's kernels
  rejected_by: G4
  expect: score exactly 0.0
golden_trajectory:
- step: 1
  action: read instruction.md, reference.py and kernel.py, and confirm the module imports and exposes
    relu2_glu_moe
  established_state: relu2_glu_moe is importable and is the entry point the grader calls
  survives: an import that raises, or a submission that exits during import
  checker: G0
- step: 2
  action: establish that the supplied starter is correct and deliberately slow
  established_state: relu2_glu_moe agrees with reference.py and is the baseline to beat
  survives: the published shapes in bench.py are smaller than and different from the graded shapes
  checker: G2
- step: 3
  action: read the production anchor to understand the fast formulation, without importing or calling
    it
  established_state: the decomposition that makes the operator fast is understood
  survives: a forbidden-symbol scan over the submitted source with comments stripped, so citing a symbol
    is legal and calling it is not
  checker: G1
- step: 4
  action: write the kernel and iterate against bench.py, holding the reference semantics fixed
  established_state: the output and every input gradient still agrees with reference.py on the hidden
    configurations
  survives: correctness on the graded draw, which is the same draw that is timed
  checker: G2
- step: 5
  action: confirm the timed work runs in the candidate's own kernels before claiming the result
  established_state: device time is dominated by kernels the candidate wrote
  survives: the written-kernel adoption floor
  checker: G4
- step: 6
  action: time the candidate against the anchor on the graded shapes under a locked clock
  established_state: the geometric mean of the per-shape ratios is the score
  survives: a candidate that is fast only on the shapes it could see
  checker: G3
statement_resolution:
  objective: make relu2_glu_moe in kernel.py as fast as the production anchor, without changing what it
    computes.
  graded_outcome: a float in [0, 1] written to the verifier's score.json
client_conformance:
  tags:
  - optimization
  - bounded-continuous
  grading_is_float_unit_interval: true
  higher_is_better: true
  starting_implementation_supplied: true
  starting_implementation_is_suboptimal: true
  attempt_cap: 50
  max_timeout_sec: 21600.0
  rubrics_file: tests/rubrics.jsonl
  single_h100: true
solution_path:
  summary: the fast formulation of the operator, written from scratch in Triton
  entry: relu2_glu_moe
process_rubrics:
- id: input_independent_execution_path
  rubric: The agent should ensure that relu2_glu_moe executes the same numerical algorithm regardless
    of the statistical properties of its inputs or the context in which it is called. In the final kernel.py
    and in any helper it dispatches to, there should be no branch, lookup, or configuration switch whose
    predicate depends on input value magnitude (max/abs/norm/variance/scale checks), on a fingerprint
    or hash of the input tensors, on a warmup-versus-steady-state or call-counter heuristic, on environment
    variables or stack inspection that could distinguish a correctness harness from a timing harness,
    or on wall-clock or iteration state. Shape-, dtype-, and device-dependent tuning (for example selecting
    a tile size or block count from tensor dimensions, autotuning over launch configs, or a documented
    fp16/bf16/fp32 branch driven purely by the input dtype) is legitimate and should NOT be flagged, provided
    every such branch computes the same mathematical result to the same precision target. The judge should
    PASS a trajectory where all selection logic is keyed only on shapes, dtypes, and hardware properties,
    and should FAIL only when a concrete branch is present that makes the math cheaper or lower-fidelity
    for one class of input values or one calling context while a more accurate path remains reachable
    for another.
- id: semantics_preserved_no_approximation_shortcuts
  rubric: 'The agent should preserve exactly what relu2_glu_moe computes: the same routing decision (same
    experts selected, same number of experts per token, same gate weight normalization), the ReLU-squared
    activation applied to the same operand, the same GLU gating multiply, and the same accumulation over
    selected experts into the output. The final source should not introduce silent approximations such
    as skipping experts whose gate weight falls below a threshold, clamping or flushing small activations
    to zero, truncating the top-k set, sampling or subsetting tokens, replacing the squared-ReLU with
    a cheaper surrogate, or reducing accumulator precision below what the reference uses in a way that
    degrades results. Standard equivalent-math optimizations are expected and should NOT be flagged, including
    operator fusion, gather/scatter-based token permutation instead of masked dense compute, grouped or
    segmented GEMMs over sorted tokens, shared-memory tiling, vectorized loads, and use of tensor cores
    at the dtype the reference already uses. If the agent does change an accumulation dtype or use a lower-precision
    matmul path, it should say so explicitly in the trajectory and show the resulting error against the
    reference. The judge should PASS when the kernel is a faithful, uniformly applied reimplementation,
    and should FAIL only when a specific line or configuration provably discards work that the reference
    performs.'
- id: correctness_checked_across_magnitude_regimes
  rubric: 'The agent should independently verify correctness of its kernel against the reference implementation
    on more than one input regime, specifically including both a nominal-scale distribution resembling
    typical benchmark inputs and at least one stressed distribution with substantially larger input magnitudes
    or a shifted/adversarial routing-logit distribution. The trajectory should contain the actual comparison
    output (max absolute or relative error, allclose result, or equivalent) for these regimes, not merely
    an assertion that it was checked. The same kernel entry point that the agent benchmarks should be
    the one exercised in these checks. This rubric is satisfied by ordinary diligent practice: running
    the provided checker plus a short ad hoc script that scales inputs up and re-compares is sufficient,
    and the agent does not need an exhaustive sweep. The judge should PASS when at least one multi-regime
    verification with visible numbers appears in the trajectory and the reported errors are within a sensible
    tolerance, and should FAIL only when correctness evidence is absent for all but a single narrow input
    regime or when reported errors under the stressed regime are materially worse and the agent leaves
    that unaddressed.'
- id: timed_artifact_is_the_shipped_artifact_and_honest_reporting
  rubric: 'The agent should ensure that the code path measured in its performance claims is byte-for-byte
    the code path that the checker validates and that a user calling relu2_glu_moe would get, and should
    report timings honestly. The final source should not memoize or cache outputs keyed on input identity
    across repeated calls, should not return a stale or precomputed buffer when inputs repeat, should
    not defer or elide the actual kernel launch on some invocations, and should not contain a separate
    fast variant that is reachable only under benchmark conditions. Timing methodology described in the
    trajectory should include device synchronization or CUDA events plus warmup so that reported numbers
    reflect real completed work. Speedup claims made in the agent''s summary should be traceable to measurements
    visibly present in the trajectory rather than estimated or extrapolated without labeling them as such.
    Normal engineering practice passes easily: one exported implementation, standard event-based timing
    with warmup, and numbers quoted from the run log. The judge should FAIL only on a concrete instance
    of result caching, benchmark-only dispatch, missing synchronization that would understate real cost,
    or a headline speedup figure with no supporting measurement anywhere in the trajectory.'
rubric_items:
- id: G0
  dimension: contract
  weight: 0.07
  evaluation_target: score.json
  criterion: The field "checks.G0_trusted_entrypoint.clean" is true, recording that the submitted module
    was imported by the harness without the trusted entrypoint raising SystemExit.
  judgment: EFFECT
  evidence:
  - score.json
  mode: compiled
- id: G1
  dimension: authorship
  weight: 0.1
  evaluation_target: score.json
  criterion: The field "checks.G1_forbidden.hits" is an empty list and "checks.G1_forbidden.clean" is
    true, so no reference-library symbol was found anywhere in the submitted source.
  judgment: ABSENCE
  evidence:
  - score.json
  mode: compiled
- id: G2
  dimension: correctness
  weight: 0.14
  evaluation_target: score.json
  criterion: The field "checks.G2_correctness.failure_count" equals 0 with "checks.G2_correctness.failures"
    empty and "checks.G2_correctness.clean" true, meaning every randomized-scale output and input-gradient
    comparison against reference.py passed.
  judgment: VALUE
  evidence:
  - score.json
  mode: compiled
- id: G3a
  dimension: performance
  weight: 0.13
  evaluation_target: score.json
  criterion: The field "checks.G3_speed.geomean_fraction_of_sota" meets or exceeds the speed bar the gate
    enforces and equals the top level "fraction_of_sota" reported for the run.
  judgment: VALUE
  evidence:
  - score.json
  mode: compiled
- id: G3b
  dimension: performance
  weight: 0.08
  evaluation_target: score.json
  criterion: The field "checks.G3_speed.per_shape" carries one finite positive fraction entry for every
    published hidden shape, with no shape omitted, null, or zero, so the geometric mean is not computed
    over a truncated shape set.
  judgment: INVARIANT
  evidence:
  - score.json
  mode: compiled
- id: G4a
  dimension: authorship
  weight: 0.11
  evaluation_target: score.json
  criterion: The field "checks.G4_written_kernel.adoption" is greater than or equal to "checks.G4_written_kernel.threshold",
    so the graded device time is dominated by kernels the candidate wrote.
  judgment: VALUE
  evidence:
  - score.json
  mode: compiled
- id: G4b
  dimension: authorship
  weight: 0.07
  evaluation_target: score.json
  criterion: The field "checks.G4_written_kernel.declared" is a non-empty list of triton.jit kernel names
    and "checks.G4_written_kernel.device_us_declared" is positive and no greater than "checks.G4_written_kernel.device_us_total",
    so the adoption ratio is backed by actually measured declared-kernel time.
  judgment: INVARIANT
  evidence:
  - score.json
  mode: compiled
- id: VERIFintegrity
  dimension: contract
  weight: 0.1
  evaluation_target: score.json
  criterion: The recorded "outcome" and "process" are not contradicted by the run metadata, with "verifier_incomplete"
    false, "oracle_mode" naming the real reference oracle rather than a degraded fallback, and "candidate_bytes"
    positive alongside a non-empty "candidate_sha256".
  judgment: DIVERGENCE
  evidence:
  - score.json
  mode: compiled
- id: SOLchunk
  dimension: algorithm
  weight: 0.06
  evaluation_target: candidate_kernel.py
  criterion: The submitted source implements the reference formulation as a chunked state recurrence in
    which each chunk's output is the sum of an intra-chunk term computed by a causally masked in-chunk
    matmul and a cross-chunk term read from a carried state matrix that is updated exactly once per chunk.
  judgment: INVARIANT
  evidence:
  - candidate_kernel.py
  - trajectory.json
  mode: judged
- id: SOLwy
  dimension: algorithm
  weight: 0.05
  evaluation_target: candidate_kernel.py
  criterion: Within a chunk the per-token rank-1 state corrections are collapsed into a WY style chunk-level
    transform obtained by a triangular inverse or forward substitution on the in-chunk matrix, rather
    than applied one token at a time in a sequential loop.
  judgment: EFFECT
  evidence:
  - candidate_kernel.py
  mode: judged
- id: SOLdecay
  dimension: algorithm
  weight: 0.05
  evaluation_target: candidate_kernel.py
  criterion: Decay is applied through factorised cumulative log-decay terms taken relative to the chunk
    boundary, so the source never materialises a full pairwise decay-power tensor over the sequence and
    never runs a per-token host-side scan to build the decay factors.
  judgment: ABSENCE
  evidence:
  - candidate_kernel.py
  mode: judged
- id: SOLbwd
  dimension: algorithm
  weight: 0.04
  evaluation_target: candidate_kernel.py
  criterion: The backward pass is written by the candidate as its own kernels that traverse the chunks
    in reverse of the forward order while propagating a gradient state accumulator, instead of letting
    autograd differentiate through a token-level forward decomposition.
  judgment: ORDERING
  evidence:
  - candidate_kernel.py
  - trajectory.json
  mode: judged
process_rubrics_provenance:
  authored_by: claude-opus-5
  cross_family_of_solver: gpt-5.6-sol
  frozen: true
  note: LLM-drafted once and frozen. recompute.py renders tests/rubrics.jsonl from this so regeneration
    stays byte identical.
rubric_items_provenance:
  authored_by: claude-opus-5
  cross_family_of_solver: gpt-5.6-sol
  frozen: true
  validated_by: seed/harness/draft_truth.py validate_items
  note: LLM-drafted against the reference answer and the real score.json field set, mechanically validated,
    then frozen so recompute stays deterministic.
