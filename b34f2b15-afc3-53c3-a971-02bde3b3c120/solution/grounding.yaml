schema: forge.grounding/v4
bundle_family: selection_topk_giant_row_fwd
identity:
  anchor_kind: torch_builtin
  anchor_symbol: torch.topk
  anchor_note: 'CUDA torch.topk (CUB radix select) is the TIMING DENOMINATOR ONLY. At

    small k over a multi-megabyte row CUB collapses to a single streaming

    read of the row plus O(log2 N) shallow radix passes, so its measured

    bandwidth sits close to HBM peak. That is exactly what makes the

    reachable fraction low: the anchor is near roofline, and a candidate

    must land the same one-pass streaming read AND keep >= 60% of device

    time inside its own kernels. It is never consulted for correctness --

    reference.py''s stable descending argsort defines that. No vendorable

    source tree exists for a torch builtin, so the shingle scan records

    available:false and never gates; the FORBIDDEN symbol scan still runs.'
  role: denominator and nothing else. The anchor is available to the verifier for timing. It is never
    the edit surface, and the agent may read it but may not call it.
  sota_repository: torch.topk
  sota_commit: not pinned; the anchor is a library symbol, not a checkout
  sota_commit_utc: '2025-01-01T00:00:00Z'
  train_cutoff: '2025-01-01'
  license: upstream license of the anchor library
task:
  editable: kernel.py
  reference: reference.py
  agent_visible:
  - instruction.md
  - kernel.py
  - reference.py
  - bench.py
  surface: forward
  objective: implement topk_giant_row in kernel.py for the H100 and get as close as possible to the speed
    of the production anchor, without changing what it computes.
discovery:
  note: >-
    FORGE.md 10a.1. Graded values a solver can obtain only by running against the built
    environment. Each appears in this file, is established in the container at grade time,
    and is absent from the bound statement_closure verbatim and as paraphrase. recompute.py
    derives each from its grounding source, never from a statement literal.
  values:
    - name: target_fraction_of_sota
      grounding_source: grading.target_fraction_of_sota
      environment_state: tests/target.json
      absent_from_closure: true
      obtained_by: >-
        measuring the candidate against the production anchor on the graded cells; the pass
        bar is never stated, so a solver learns where it stands only by being graded
    - name: starter_fraction_of_sota
      grounding_source: grading.starter_fraction_of_sota
      environment_state: tests/target.json
      absent_from_closure: true
      obtained_by: >-
        grading the shipped starter; the statement says the starter is suboptimal but never
        by how much, so the headroom is discovered rather than read
    - name: graded_shape_set
      grounding_source: grading.definition
      environment_state: tests/hidden_shapes.json
      absent_from_closure: true
      obtained_by: >-
        empirical probing across shape and dtype; the statement says timing runs on hidden
        shapes but names none, so which cells dominate the geomean is discovered
    - name: anchor_device_time
      grounding_source: identity.anchor_symbol
      environment_state: tests/target.json
      absent_from_closure: true
      obtained_by: >-
        timing the production anchor in the graded environment; the anchor is readable but
        its measured device time on this host is not stated
forbidden_symbols:
- torch.topk
- torch.sort
- torch.argsort
- torch.msort
- torch.kthvalue
- torch.unique
- torch.median
- torch.nanmedian
- torch.quantile
- torch.nanquantile
- .topk
- .sort
- .argsort
- .msort
- .kthvalue
- .unique
- .median
- .quantile
shapes:
  seed_base: 72439
  published:
    p1:
      R: 16
      N: 524288
      k: 32
    p2:
      R: 8
      N: 1048576
      k: 64
  published_note: the published shapes are what bench.py times and are deliberately not the graded set.
    The graded shapes, scales and value distributions stay hidden, so a candidate tuned only to what it
    can see does not transfer.
  graded:
    g1:
      R: 16
      N: 262144
      k: 16
      dtypes:
      - float32
      - bfloat16
    g2:
      R: 32
      N: 524288
      k: 32
      dtypes:
      - float32
      - bfloat16
    g3:
      R: 8
      N: 1048576
      k: 64
      dtypes:
      - float32
      - bfloat16
  correctness_only:
    c1:
      R: 4
      N: 4194304
      k: 32
      dtypes:
      - float32
      - bfloat16
    c2:
      R: 3
      N: 999983
      k: 100
      dtypes:
      - float32
      - bfloat16
    c3:
      R: 2
      N: 3145728
      k: 1
      dtypes:
      - float32
      - bfloat16
    c4:
      R: 8
      N: 262144
      k: 64
      quantize: 16
      dtypes:
      - float32
      - bfloat16
    c5:
      R: 4
      N: 300007
      k: 77
      specials: 1
      dtypes:
      - float32
      - bfloat16
    c6:
      R: 700
      N: 3145728
      k: 32
      dtypes:
      - bfloat16
  graded_budget_note: 'trimmed to <=6 timed configs (shape x dtype) so a 20-attempt run fits the 6h max_timeout;
    dropped [''g4'']. Correctness coverage is unchanged: it lives in correctness_only, which is untimed.'
grading:
  metric: fraction_of_sota
  definition: per graded shape r = t_anchor / t_candidate clipped into [0, 1]; R is the geometric mean
    of r; the score is R relative to the target and is zero unless every gate passes.
  target_fraction_of_sota: 0.3003
  starter_fraction_of_sota: 0.156639
  frontier_defeat_floor_S: 0.15
  written_kernel_adoption_floor: 0.6
  adoption_floor: 0.6
  tolerances:
    float32:
      atol: 0.0
      rtol: 0.0
    bfloat16:
      atol: 0.0
      rtol: 0.0
  exactness: exact equality
oracle:
  path: solution/oracle_kernel.py
  strategy: independent_reimplementation
  reaches_full_reward: true
  role: the private oracle establishes that the full-reward point of the metric is reachable on this hardware.
    It is never shipped to the agent.
distribution_invariance:
  rule: the checked draw and the timed draw are the same draw
  why: a candidate that could tell the correctness distribution from the timed one could be correct on
    one and fast on the other.
environment:
  base_image: nvidia/cuda:12.8.0-devel-ubuntu24.04@sha256:813c3b834aaafe2df2891f9a840c412a4df3c073dd9e0ac75aab810ed82a5b48
  triton_floor: 3.7.1
  triton_floor_reason: measured on this host. Below this floor the graded denominator does not run correctly
    on Hopper, which makes the bundle ungradable rather than merely slower.
  network: no-network
  single_h100: true
  harbor_enum_note: Harbor's TaskConfig accepts exactly no-network, public or allowlist; the literal string
    full-internet is rejected at task load.
checkers:
  G0:
    name: trusted_entrypoint
    verifies: the submitted module imports and exposes topk_giant_row. A candidate that calls sys.exit
      during import is trapped rather than terminating the grader.
  G1:
    name: forbidden_symbols
    verifies: the submission neither imports nor calls the production kernel or any equivalent library
      implementation, scanned over the source with comments stripped so that citing a symbol stays legal
      and calling it does not.
  G2:
    name: correctness
    verifies: the output agrees with reference.py on every hidden configuration, on the same randomly
      scaled draw that is timed, so no branch can tell the checked distribution from the timed one.
  G3:
    name: speed
    verifies: the candidate is timed against the anchor on the graded shapes under a locked clock, and
      the geometric mean of the per-shape ratios becomes the score.
  G4:
    name: written_kernel
    verifies: the share of device time spent in the candidate's OWN kernels clears the adoption floor,
      so a submission that delegates the work elsewhere cannot claim the result.
negative_controls:
- id: NC1
  name: unmodified_starter
  expect: score well below target; the starter is the deliberately sub-optimal implementation
- id: NC2
  name: library_call
  detail: submission imports or calls the production kernel
  rejected_by: G1
  expect: score exactly 0.0
- id: NC3
  name: fast_and_wrong
  detail: accumulation precision dropped to buy speed
  rejected_by: G2
  expect: score exactly 0.0
- id: NC4
  name: delegated_work
  detail: the timed region runs in someone else's kernels
  rejected_by: G4
  expect: score exactly 0.0
golden_trajectory:
- step: 1
  action: read instruction.md, reference.py and kernel.py, and confirm the module imports and exposes
    topk_giant_row
  established_state: topk_giant_row is importable and is the entry point the grader calls
  survives: an import that raises, or a submission that exits during import
  checker: G0
- step: 2
  action: establish that the supplied starter is correct and deliberately slow
  established_state: topk_giant_row agrees with reference.py and is the baseline to beat
  survives: the published shapes in bench.py are smaller than and different from the graded shapes
  checker: G2
- step: 3
  action: read the production anchor to understand the fast formulation, without importing or calling
    it
  established_state: the decomposition that makes the operator fast is understood
  survives: a forbidden-symbol scan over the submitted source with comments stripped, so citing a symbol
    is legal and calling it is not
  checker: G1
- step: 4
  action: write the kernel and iterate against bench.py, holding the reference semantics fixed
  established_state: the output still agrees with reference.py on the hidden configurations
  survives: correctness on the graded draw, which is the same draw that is timed
  checker: G2
- step: 5
  action: confirm the timed work runs in the candidate's own kernels before claiming the result
  established_state: device time is dominated by kernels the candidate wrote
  survives: the written-kernel adoption floor
  checker: G4
- step: 6
  action: time the candidate against the anchor on the graded shapes under a locked clock
  established_state: the geometric mean of the per-shape ratios is the score
  survives: a candidate that is fast only on the shapes it could see
  checker: G3
statement_resolution:
  objective: make topk_giant_row in kernel.py as fast as the production anchor, without changing what
    it computes.
  graded_outcome: a float in [0, 1] written to the verifier's score.json
client_conformance:
  tags:
  - optimization
  - bounded-continuous
  grading_is_float_unit_interval: true
  higher_is_better: true
  starting_implementation_supplied: true
  starting_implementation_is_suboptimal: true
  attempt_cap: 50
  max_timeout_sec: 21600.0
  rubrics_file: tests/rubrics.jsonl
  single_h100: true
solution_path:
  summary: the fast formulation of the operator, written from scratch in Triton
  entry: topk_giant_row
process_rubrics:
- id: no_input_distribution_or_context_dependent_fast_paths
  rubric: 'The agent should ensure the final `topk_giant_row` implementation performs the same algorithmic
    work regardless of the statistical character of the data or the calling context, so that a correctness
    run and a timing run of the same shape execute the same code path. Concretely, the final source should
    contain no branch, threshold, heuristic, or early-exit whose condition depends on properties of the
    key/value payload such as magnitude range, dynamic range or exponent spread, sortedness, number of
    distinct values, sparsity, entropy, sampled statistics of a prefix of the row, or a detected ''stress''
    versus ''nominal'' distribution, and no dependence on call count, invocation index, global/static
    mutable state, wall-clock or elapsed time, warmup flags, environment variables, stack inspection,
    or whether a validator versus a benchmark harness is the caller. Specialization is acceptable and
    should be treated as passing when it is keyed only on statically declared, contract-level properties
    that the caller supplies or that are visible in the tensor metadata: row length n, k, dtype, device,
    layout/stride/contiguity, alignment, and hardware capability. A trajectory that never introduces such
    data- or context-conditioned switching, or that introduces one and then removes it before the final
    version, satisfies this rubric; the judge should point at the specific line and condition before failing,
    and should not fail an implementation merely because a value-independent algorithm has data-dependent
    runtime (for example, an atomics-based filter whose survivor count varies with the data) as long as
    every input takes the same sequence of kernels and produces the same result contract.'
  id_note: null
- id: recomputes_fully_no_result_caching_or_replay
  rubric: The agent should ensure every call to `topk_giant_row` computes its output from the current
    input tensor, with no memoization or replay of previously produced results. The final source should
    not cache outputs keyed on input pointer, data_ptr, shape, hash, or a sampled fingerprint of the row,
    should not return a stored buffer from a prior invocation, should not skip work because the input
    'looks like' one seen before, and should not lazily defer computation past the point where the function
    returns in a way that would let a timing harness measure an unsynchronized or empty call. Reusing
    preallocated scratch/workspace buffers, reusing compiled kernel handles or autotuned launch configurations,
    and caching device properties are all legitimate and should pass; the distinction the judge should
    draw is between caching *machinery* (allowed) and caching *answers* (not allowed). If the implementation
    is asynchronous on the GPU, the trajectory or code should make clear that the returned tensor is a
    real dependency of the launched work so that a synchronizing timer measures the full computation.
  id_note: null
- id: preserves_exact_topk_semantics_and_output_contract
  rubric: The agent should preserve exactly what the original `topk_giant_row` computed, so the optimization
    is a pure speedup rather than a redefinition of the task. The final implementation should return the
    same selected elements and the same indices for the same input, honoring the original contract on
    ordering (whether results are returned sorted by value or unordered), tie-breaking among equal values,
    index dtype and base, output dtype and shape, and handling of edge cases the original handled such
    as k equal to zero, k equal to or greater than n, NaN or infinite entries, and negative values. The
    agent should not substitute an approximate or probabilistic top-k (sampling, sketching, single-pass
    radix that stops early and accepts a fuzzy boundary, threshold guessing without a verification pass),
    should not silently reduce precision in comparisons in a way that can reorder near-equal elements,
    and should not narrow the supported input domain (for example, assuming all keys are non-negative,
    assuming they fit in a smaller integer type, or assuming no duplicates) unless that assumption is
    documented as part of the original contract. The trajectory should show at least one correctness comparison
    of the optimized kernel against the original or a reference implementation on inputs that exercise
    the general case, and the judge should credit any such evidence rather than demanding a specific test
    format.
  id_note: null
- id: honest_and_reproducible_performance_evidence
  rubric: The agent should support its speed claim with measurements that a reader could reproduce, and
    should describe the result accurately. The trajectory should show timing of the optimized `topk_giant_row`
    against the production anchor using the same input shapes and the same data-generation procedure that
    the correctness checks used, with device synchronization around the timed region, discarded warmup
    iterations, and enough repetitions that the reported number is not a single noisy sample. The agent
    should report the measured numbers as observed, including cases where the kernel is slower than the
    anchor on some shape or k, rather than quoting only the most favorable configuration as if it were
    general, and should not claim a speedup that the trajectory's own output does not show. If the agent
    benchmarks on a narrower set of inputs than it supports, it should say so. The judge should pass any
    solution whose reported claim is consistent with the timing evidence present in the trajectory, and
    should not fail an agent for modest speedups, for tooling limitations that prevented benchmarking
    on some configuration, or for benchmarking methodology choices that are disclosed.
rubric_items:
- id: G0
  dimension: contract
  weight: 0.06
  evaluation_target: score.json
  criterion: '`checks.G0_trusted_entrypoint.clean` is true, recording that importing the submitted module
    completed without raising SystemExit.'
  judgment: VALUE
  evidence:
  - score.json
  mode: compiled
- id: G1
  dimension: authorship
  weight: 0.1
  evaluation_target: score.json
  criterion: '`checks.G1_forbidden.hits` is an empty list, so no reference-library symbol appears anywhere
    in the submitted source.'
  judgment: ABSENCE
  evidence:
  - score.json
  mode: compiled
- id: G2
  dimension: correctness
  weight: 0.18
  evaluation_target: score.json
  criterion: '`checks.G2_correctness.failure_count` is 0 and `checks.G2_correctness.failures` is empty,
    so both the output and the input gradients matched reference.py at every randomized scale exercised.'
  judgment: VALUE
  evidence:
  - score.json
  mode: compiled
- id: G2b
  dimension: integrity
  weight: 0.06
  evaluation_target: score.json
  criterion: '`verifier_incomplete` is false and `oracle_mode` names a live oracle comparison rather than
    a degraded or skipped fallback, so the correctness verdict rests on a complete run.'
  judgment: INVARIANT
  evidence:
  - score.json
  mode: compiled
- id: G3a
  dimension: performance
  weight: 0.16
  evaluation_target: score.json
  criterion: '`checks.G3_speed.geomean_fraction_of_sota` is at least 0.8 and the top-level `fraction_of_sota`
    reports that same value, placing the candidate within the accepted band of the production kernel over
    the hidden shapes.'
  judgment: VALUE
  evidence:
  - score.json
  mode: compiled
- id: G3b
  dimension: performance
  weight: 0.08
  evaluation_target: score.json
  criterion: '`checks.G3_speed.per_shape` is non-empty and every shape entry it contains reports a fraction
    of at least 0.5, so no single hidden shape collapses while the rest carry `checks.G3_speed.geomean_fraction_of_sota`.'
  judgment: INVARIANT
  evidence:
  - score.json
  mode: compiled
- id: G4a
  dimension: authorship
  weight: 0.1
  evaluation_target: score.json
  criterion: '`checks.G4_written_kernel.adoption` is greater than or equal to `checks.G4_written_kernel.threshold`,
    so the graded device time is dominated by kernels the candidate wrote.'
  judgment: VALUE
  evidence:
  - score.json
  mode: compiled
- id: G4b
  dimension: authorship
  weight: 0.06
  evaluation_target: score.json
  criterion: '`checks.G4_written_kernel.declared` lists at least one triton.jit kernel name and `checks.G4_written_kernel.device_us_declared`
    is greater than zero out of a positive `checks.G4_written_kernel.device_us_total`, showing the declared
    kernels actually executed on device.'
  judgment: EFFECT
  evidence:
  - score.json
  mode: compiled
- id: SOLchunk
  dimension: algorithm
  weight: 0.07
  evaluation_target: candidate_kernel.py
  criterion: The source splits the sequence into fixed-size chunks and computes each chunk as an intra-chunk
    masked block product plus a cross-chunk contribution read from a running state matrix that is updated
    chunk by chunk in sequence order.
  judgment: ORDERING
  evidence:
  - candidate_kernel.py
  mode: judged
- id: SOLwy
  dimension: algorithm
  weight: 0.05
  evaluation_target: candidate_kernel.py
  criterion: Within a chunk the per-row rank-1 corrections are collapsed into a compact WY style representation
    obtained by one triangular inversion or forward substitution per chunk, rather than a sequential row-by-row
    loop over the chunk.
  judgment: VALUE
  evidence:
  - candidate_kernel.py
  - trajectory.json
  mode: judged
- id: SOLdecay
  dimension: algorithm
  weight: 0.04
  evaluation_target: candidate_kernel.py
  criterion: Decay is applied by factorising cumulative log-decay onto the chunk operands so that pairwise
    gates arise as ratios of cumulative products inside the block matmul, with no dense per-pair gate
    matrix built in memory.
  judgment: INVARIANT
  evidence:
  - candidate_kernel.py
  mode: judged
- id: SOLbackward
  dimension: algorithm
  weight: 0.04
  evaluation_target: candidate_kernel.py
  criterion: The input gradients are produced by an explicit reverse chunk scan written in the candidate's
    own kernels that mirrors the forward decomposition, not by autograd tracing through elementwise Python-level
    ops.
  judgment: EFFECT
  evidence:
  - candidate_kernel.py
  - trajectory.json
  mode: judged
process_rubrics_provenance:
  authored_by: claude-opus-5
  cross_family_of_solver: gpt-5.6-sol
  frozen: true
  note: LLM-drafted once and frozen. recompute.py renders tests/rubrics.jsonl from this so regeneration
    stays byte identical.
rubric_items_provenance:
  authored_by: claude-opus-5
  cross_family_of_solver: gpt-5.6-sol
  frozen: true
  validated_by: seed/harness/draft_truth.py validate_items
  note: LLM-drafted against the reference answer and the real score.json field set, mechanically validated,
    then frozen so recompute stays deterministic.
