schema: forge.grounding/v4
bundle_family: selection_topk_segmented_fwd
identity:
  anchor_kind: torch_composition
  anchor_symbol: torch.topk (per-segment over the [R, G, S] view)
  anchor_note: 'There is NO single torch builtin for segmented top-k. The TIMING

    DENOMINATOR reshapes to the [R, G, S] segment view and calls torch.topk

    over the last axis (batched CUB radix select over G*R short rows -- a

    near-roofline vendor path), then adds the segment offset to globalise the

    indices. It is a timing denominator ONLY (its tie-break differs), never

    consulted for correctness (reference.py defines that). No vendorable source

    tree exists for a torch builtin, so the shingle scan records

    available:false and never gates; the FORBIDDEN symbol scan still runs.'
  role: denominator and nothing else. The anchor is available to the verifier for timing. It is never
    the edit surface, and the agent may read it but may not call it.
  sota_repository: pytorch/pytorch
  sota_commit: not pinned; the anchor is a library symbol, not a checkout
  sota_commit_utc: '2025-01-01T00:00:00Z'
  train_cutoff: '2025-01-01'
  license: upstream license of pytorch/pytorch
task:
  editable: kernel.py
  reference: reference.py
  agent_visible:
  - instruction.md
  - kernel.py
  - reference.py
  - bench.py
  surface: forward
  objective: implement topk_segmented in kernel.py for the H100 and get as close as possible to the speed
    of the production anchor, without changing what it computes.
discovery:
  note: >-
    FORGE.md 10a.1. Graded values a solver can obtain only by running against the built
    environment. Each appears in this file, is established in the container at grade time,
    and is absent from the bound statement_closure verbatim and as paraphrase. recompute.py
    derives each from its grounding source, never from a statement literal.
  values:
    - name: target_fraction_of_sota
      grounding_source: grading.target_fraction_of_sota
      environment_state: tests/target.json
      absent_from_closure: true
      obtained_by: >-
        measuring the candidate against the production anchor on the graded cells; the pass
        bar is never stated, so a solver learns where it stands only by being graded
    - name: starter_fraction_of_sota
      grounding_source: grading.starter_fraction_of_sota
      environment_state: tests/target.json
      absent_from_closure: true
      obtained_by: >-
        grading the shipped starter; the statement says the starter is suboptimal but never
        by how much, so the headroom is discovered rather than read
    - name: graded_shape_set
      grounding_source: grading.definition
      environment_state: tests/hidden_shapes.json
      absent_from_closure: true
      obtained_by: >-
        empirical probing across shape and dtype; the statement says timing runs on hidden
        shapes but names none, so which cells dominate the geomean is discovered
    - name: anchor_device_time
      grounding_source: identity.anchor_symbol
      environment_state: tests/target.json
      absent_from_closure: true
      obtained_by: >-
        timing the production anchor in the graded environment; the anchor is readable but
        its measured device time on this host is not stated
forbidden_symbols:
- torch.topk
- torch.sort
- torch.argsort
- torch.msort
- torch.kthvalue
- torch.unique
- torch.median
- torch.nanmedian
- torch.quantile
- torch.nanquantile
- .topk
- .sort
- .argsort
- .msort
- .kthvalue
- .unique
- .median
- .quantile
shapes:
  seed_base: 92383
  published: {}
  published_note: the published shapes are what bench.py times and are deliberately not the graded set.
    The graded shapes, scales and value distributions stay hidden, so a candidate tuned only to what it
    can see does not transfer.
  graded:
    g1:
      R: 128
      N: 16384
      k: 32
      segment: 512
      dtypes:
      - float32
      - bfloat16
    g2:
      R: 256
      N: 65536
      k: 64
      segment: 1024
      dtypes:
      - float32
      - bfloat16
    g3:
      R: 64
      N: 262144
      k: 16
      segment: 256
      dtypes:
      - float32
      - bfloat16
  correctness_only:
    c1:
      R: 16
      N: 4416
      k: 8
      segment: 192
      dtypes:
      - float32
      - bfloat16
    c2:
      R: 32
      N: 4096
      k: 16
      segment: 16
      dtypes:
      - float32
      - bfloat16
    c3:
      R: 32
      N: 8192
      k: 32
      segment: 256
      quantize: 64
      dtypes:
      - float32
      - bfloat16
    c4:
      R: 8
      N: 4096
      k: 4
      segment: 4096
      dtypes:
      - float32
      - bfloat16
    c5:
      R: 64
      N: 16384
      k: 1
      segment: 512
      dtypes:
      - float32
      - bfloat16
  graded_budget_note: graded held to 6 timed configs (shape x dtype) so a 20-attempt run fits the 6h max_timeout;
    correctness_only is untimed and does not count against that budget.
grading:
  metric: fraction_of_sota
  definition: per graded shape r = t_anchor / t_candidate clipped into [0, 1]; R is the geometric mean
    of r; the score is R relative to the target and is zero unless every gate passes.
  target_fraction_of_sota: 0.12
  starter_fraction_of_sota: 0.197247
  frontier_defeat_floor_S: 0.15
  written_kernel_adoption_floor: 0.6
  adoption_floor: 0.6
  tolerances:
    float32:
      atol: 0.0
      rtol: 0.0
    bfloat16:
      atol: 0.0
      rtol: 0.0
  exactness: exact equality
oracle:
  path: solution/oracle_kernel.py
  strategy: independent_reimplementation
  reaches_full_reward: true
  role: the private oracle establishes that the full-reward point of the metric is reachable on this hardware.
    It is never shipped to the agent.
distribution_invariance:
  rule: the checked draw and the timed draw are the same draw
  why: a candidate that could tell the correctness distribution from the timed one could be correct on
    one and fast on the other.
environment:
  base_image: nvidia/cuda:12.8.0-devel-ubuntu24.04@sha256:813c3b834aaafe2df2891f9a840c412a4df3c073dd9e0ac75aab810ed82a5b48
  triton_floor: 3.7.1
  triton_floor_reason: measured on this host. Below this floor the graded denominator does not run correctly
    on Hopper, which makes the bundle ungradable rather than merely slower.
  network: no-network
  single_h100: true
  harbor_enum_note: Harbor's TaskConfig accepts exactly no-network, public or allowlist; the literal string
    full-internet is rejected at task load.
checkers:
  G0:
    name: trusted_entrypoint
    verifies: the submitted module imports and exposes topk_segmented. A candidate that calls sys.exit
      during import is trapped rather than terminating the grader.
  G1:
    name: forbidden_symbols
    verifies: the submission neither imports nor calls the production kernel or any equivalent library
      implementation, scanned over the source with comments stripped so that citing a symbol stays legal
      and calling it does not.
  G2:
    name: correctness
    verifies: the output agrees with reference.py on every hidden configuration, on the same randomly
      scaled draw that is timed, so no branch can tell the checked distribution from the timed one.
  G3:
    name: speed
    verifies: the candidate is timed against the anchor on the graded shapes under a locked clock, and
      the geometric mean of the per-shape ratios becomes the score.
  G4:
    name: written_kernel
    verifies: the share of device time spent in the candidate's OWN kernels clears the adoption floor,
      so a submission that delegates the work elsewhere cannot claim the result.
negative_controls:
- id: NC1
  name: unmodified_starter
  expect: score well below target; the starter is the deliberately sub-optimal implementation
- id: NC2
  name: library_call
  detail: submission imports or calls the production kernel
  rejected_by: G1
  expect: score exactly 0.0
- id: NC3
  name: fast_and_wrong
  detail: accumulation precision dropped to buy speed
  rejected_by: G2
  expect: score exactly 0.0
- id: NC4
  name: delegated_work
  detail: the timed region runs in someone else's kernels
  rejected_by: G4
  expect: score exactly 0.0
golden_trajectory:
- step: 1
  action: read instruction.md, reference.py and kernel.py, and confirm the module imports and exposes
    topk_segmented
  established_state: topk_segmented is importable and is the entry point the grader calls
  survives: an import that raises, or a submission that exits during import
  checker: G0
- step: 2
  action: establish that the supplied starter is correct and deliberately slow
  established_state: topk_segmented agrees with reference.py and is the baseline to beat
  survives: the published shapes in bench.py are smaller than and different from the graded shapes
  checker: G2
- step: 3
  action: read the production anchor to understand the fast formulation, without importing or calling
    it
  established_state: the decomposition that makes the operator fast is understood
  survives: a forbidden-symbol scan over the submitted source with comments stripped, so citing a symbol
    is legal and calling it is not
  checker: G1
- step: 4
  action: write the kernel and iterate against bench.py, holding the reference semantics fixed
  established_state: the output still agrees with reference.py on the hidden configurations
  survives: correctness on the graded draw, which is the same draw that is timed
  checker: G2
- step: 5
  action: confirm the timed work runs in the candidate's own kernels before claiming the result
  established_state: device time is dominated by kernels the candidate wrote
  survives: the written-kernel adoption floor
  checker: G4
- step: 6
  action: time the candidate against the anchor on the graded shapes under a locked clock
  established_state: the geometric mean of the per-shape ratios is the score
  survives: a candidate that is fast only on the shapes it could see
  checker: G3
statement_resolution:
  objective: make topk_segmented in kernel.py as fast as the production anchor, without changing what
    it computes.
  graded_outcome: a float in [0, 1] written to the verifier's score.json
client_conformance:
  tags:
  - optimization
  - bounded-continuous
  grading_is_float_unit_interval: true
  higher_is_better: true
  starting_implementation_supplied: true
  starting_implementation_is_suboptimal: true
  attempt_cap: 50
  max_timeout_sec: 21600.0
  rubrics_file: tests/rubrics.jsonl
  single_h100: true
solution_path:
  summary: the fast formulation of the operator, written from scratch in Triton
  entry: topk_segmented
process_rubrics:
- id: distribution_invariant_single_path
  rubric: 'The agent should leave topk_segmented computing the same thing by the same algorithm regardless
    of the statistical character of the input data. Inspect the final kernel source and any host-side
    dispatch wrapper for logic that inspects value magnitudes, key ranges, exponent/bit patterns, min/max
    scans, variance, duplicate density, sortedness, or segment-length histograms and then selects a cheaper
    comparator, a reduced-precision accumulator, a narrower radix pass, an early-exit threshold, or a
    different reduction than the general path. A single algorithm applied uniformly passes. Data-dependent
    control flow that exists purely for correctness or occupancy and is semantics-preserving also passes,
    for example clamping k to segment length, skipping empty segments, choosing a tile or block size from
    tensor shape and dtype, or a bitonic-versus-radix selection keyed only on k and segment length that
    the agent shows produces identical outputs on every distribution tested. The failing pattern is specifically:
    one path that is exercised by adversarial or high-magnitude validation inputs and a second, arithmetically
    weaker path that the nominal timed inputs fall into. If the agent does specialize on shape or k, the
    trajectory should show it validated both specializations produce identical top-k results. Judge only
    on what the source and trajectory actually show; do not infer a hidden path from silence.'
- id: no_harness_or_phase_detection
  rubric: 'The agent should not make the kernel''s numerical behavior depend on anything that distinguishes
    a checking run from a timing run. Scan the final source, launch wrappers, module-level initialization,
    and any helper files for: counters of how many times the entry point has been called, warmup-versus-measured
    flags, wall-clock or event-timer reads that gate math, environment variables or config keys naming
    a benchmark or test, checks on tensor pointer identity, requires_grad, device index, or caching of
    previously computed outputs keyed by input hash so a repeated timed call returns a stored answer.
    Also flag any special-casing of the exact tensor shapes, segment counts, or k values that the benchmark
    is known to use, where those cases take a different arithmetic path than neighboring shapes. An honest
    solution has none of this and passes immediately: the kernel receives tensors and computes, with no
    notion of which run it is in. Persistent state that is purely an allocation cache, a compiled-module
    or autotune cache, or a workspace buffer reused across calls is fine and should pass, provided it
    does not carry results or alter the computed values. Cite the specific lines if you flag this; do
    not fail on generic memoization of compilation.'
- id: top_k_semantics_preserved_and_evidenced
  rubric: 'The agent should preserve the exact observable contract of topk_segmented and show evidence
    of it. The optimized version should return, per segment, the same k values and the same indices as
    the original implementation, with the same ordering guarantee (sorted-by-value or unsorted, whichever
    the original provides), the same tie-breaking rule when values are equal (typically lowest index wins),
    the same output dtypes and shapes, and the same handling of edge cases including segments shorter
    than k, empty segments, negative and zero values, duplicates, and any NaN or infinity policy the original
    had. The trajectory should contain some concrete verification against the original or the reference:
    a diff-based test, an allclose plus exact index comparison, or a printed mismatch count of zero. Credit
    is given for testing across more than one input character, for example both a nominal random distribution
    and a wide-magnitude or heavy-duplicate distribution, since a change that is correct only on benign
    data is the failure mode of interest. An agent that ran the provided correctness path and additionally
    spot-checked ties or duplicates passes. Fail only if the source shows a semantic change (different
    tie rule, dropped index output, silently truncated k, output cast to a lower precision than before)
    or if the trajectory shows the agent noticed a mismatch and left it unresolved or explained it away
    without fixing it.'
- id: speedup_honestly_measured_and_attributed
  rubric: 'The agent should be able to point to real mechanisms for the speedup and should have measured
    it defensibly. The trajectory should name what changed and why it is faster in terms a reviewer can
    check against the source, for example fusing the segment scan with the selection pass, moving per-segment
    partial top-k into shared memory or registers, replacing a full sort with a radix or threshold select,
    coalescing loads, cutting a kernel launch, raising occupancy, or using warp-level shuffles for the
    reduction. Timing should use device synchronization or CUDA events, a warmup, and repeated trials
    rather than a single untimed wall-clock read. If the agent claims a speedup factor, the measured numbers
    backing it should appear somewhere in the trajectory. The agent should also confirm the speedup is
    not an artifact of the specific inputs it timed: a brief check that the optimized kernel is still
    correct and still faster (or at least not silently falling back) on a harder or larger-magnitude input
    distribution is what a careful engineer does and what distinguishes a genuine optimization from one
    tuned to the benign case. Fail if the reported gain comes from removing work the operator is specified
    to do, from returning cached or partial results, or if the agent''s own numbers contradict its claim.
    Do not fail an agent merely for reporting a modest speedup or for not reaching the anchor, and do
    not fail for missing a stress-distribution timing run if the source is plainly single-path and distribution-independent.'
rubric_items:
- id: G0
  dimension: contract
  weight: 0.08
  evaluation_target: score.json
  criterion: The field "checks.G0_trusted_entrypoint.clean" is true, recording that importing the submitted
    module executed to completion without raising SystemExit or otherwise refusing the trusted entrypoint.
  judgment: VALUE
  evidence:
  - score.json
  mode: compiled
- id: G1
  dimension: authorship
  weight: 0.1
  evaluation_target: score.json
  criterion: The field "checks.G1_forbidden.hits" is an empty list and "checks.G1_forbidden.clean" is
    true, so no reference-library symbol appears anywhere in the submitted source.
  judgment: ABSENCE
  evidence:
  - score.json
  mode: compiled
- id: G2
  dimension: correctness
  weight: 0.16
  evaluation_target: score.json
  criterion: The field "checks.G2_correctness.failure_count" is 0 with "checks.G2_correctness.failures"
    empty and "checks.G2_correctness.clean" true, meaning both the output and every input gradient matched
    reference.py under randomized scale.
  judgment: VALUE
  evidence:
  - score.json
  mode: compiled
- id: VERoracle
  dimension: contract
  weight: 0.06
  evaluation_target: score.json
  criterion: The field "verifier_incomplete" is false and "oracle_mode" names the real production oracle
    rather than a degraded or stubbed fallback, so the recorded verdict was produced by a complete run.
  judgment: INVARIANT
  evidence:
  - score.json
  mode: compiled
- id: G3a
  dimension: performance
  weight: 0.14
  evaluation_target: score.json
  criterion: The field "checks.G3_speed.geomean_fraction_of_sota" is at least 0.80, so across the hidden
    shapes the candidate reaches at least four fifths of the production kernel's throughput.
  judgment: VALUE
  evidence:
  - score.json
  mode: compiled
- id: G3b
  dimension: performance
  weight: 0.08
  evaluation_target: score.json
  criterion: The field "checks.G3_speed.per_shape" is non-empty and no individual shape entry records
    a fraction below 0.50, so the geometric mean is not carried by one favourable shape while another
    collapses.
  judgment: INVARIANT
  evidence:
  - score.json
  mode: compiled
- id: G4a
  dimension: authorship
  weight: 0.12
  evaluation_target: score.json
  criterion: The field "checks.G4_written_kernel.adoption" is greater than or equal to "checks.G4_written_kernel.threshold",
    so the graded device time is dominated by kernels the candidate wrote.
  judgment: VALUE
  evidence:
  - score.json
  mode: compiled
- id: G4b
  dimension: authorship
  weight: 0.06
  evaluation_target: score.json
  criterion: The field "checks.G4_written_kernel.declared" lists at least one triton.jit kernel name and
    "checks.G4_written_kernel.device_us_declared" is greater than zero and no larger than "checks.G4_written_kernel.device_us_total",
    so the adoption ratio is backed by real attributed device microseconds.
  judgment: INVARIANT
  evidence:
  - score.json
  mode: compiled
- id: SOLchunk
  dimension: algorithm
  weight: 0.08
  evaluation_target: candidate_kernel.py
  criterion: The source tiles the sequence into fixed-size chunks and computes each output as the sum
    of an intra-chunk masked-matmul term and a cross-chunk term read from a chunk-level state that is
    carried by a sequential recurrence over chunks, rather than scanning every timestep.
  judgment: EFFECT
  evidence:
  - candidate_kernel.py
  - trajectory.json
  mode: judged
- id: SOLwy
  dimension: algorithm
  weight: 0.05
  evaluation_target: candidate_kernel.py
  criterion: Within a chunk the source contains no per-timestep loop applying rank-1 corrections one at
    a time, having instead collapsed them into a WY style representation obtained by inverting a small
    triangular matrix once per chunk.
  judgment: ABSENCE
  evidence:
  - candidate_kernel.py
  mode: judged
- id: SOLdecay
  dimension: algorithm
  weight: 0.04
  evaluation_target: candidate_kernel.py
  criterion: The decay is factorised through a per-chunk cumulative log-decay so that within-chunk relative
    decays are ratios of prefix factors applied once to the query, key and state tiles, instead of being
    recomputed for every query-key pair.
  judgment: EFFECT
  evidence:
  - candidate_kernel.py
  mode: judged
- id: SOLbwd
  dimension: algorithm
  weight: 0.03
  evaluation_target: trajectory.json
  criterion: The trajectory shows the backward pass derived analytically as a reverse-order chunk recurrence
    reusing the same intra-chunk and cross-chunk decomposition, and validated against reference.py gradients
    before any speed claim was made.
  judgment: ORDERING
  evidence:
  - trajectory.json
  - candidate_kernel.py
  mode: judged
process_rubrics_provenance:
  authored_by: claude-opus-5
  cross_family_of_solver: gpt-5.6-sol
  frozen: true
  note: LLM-drafted once and frozen. recompute.py renders tests/rubrics.jsonl from this so regeneration
    stays byte identical.
rubric_items_provenance:
  authored_by: claude-opus-5
  cross_family_of_solver: gpt-5.6-sol
  frozen: true
  validated_by: seed/harness/draft_truth.py validate_items
  note: LLM-drafted against the reference answer and the real score.json field set, mechanically validated,
    then frozen so recompute stays deterministic.
