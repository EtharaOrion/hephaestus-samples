grading:
  metric: fraction_of_sota
  definition: per graded shape r = t_anchor / t_candidate clipped into [0, 1]; R is the geometric mean
    of r; the score is R relative to the target and is zero unless every gate passes.
  target_fraction_of_sota: 0.68
  starter_fraction_of_sota: 0.007442
  frontier_defeat_floor_S: 0.15
  written_kernel_adoption_floor: 0.6
  adoption_floor: 0.6
  tolerances:
    bfloat16:
      atol: 0.05
      rtol: 0.05
    float16:
      atol: 0.01
      rtol: 0.00390625
    float32:
      atol: 0.002
      rtol: 0.002
  exactness: within dtype tolerance
oracle:
  path: solution/oracle_kernel.py
  strategy: independent_reimplementation
  reaches_full_reward: true
  role: the private oracle establishes that the full-reward point of the metric is reachable on this hardware.
    It is never shipped to the agent.
distribution_invariance:
  rule: the checked draw and the timed draw are the same draw
  why: a candidate that could tell the correctness distribution from the timed one could be correct on
    one and fast on the other.
environment:
  base_image: nvidia/cuda:12.8.0-devel-ubuntu24.04@sha256:813c3b834aaafe2df2891f9a840c412a4df3c073dd9e0ac75aab810ed82a5b48
  triton_floor: 3.7.1
  triton_floor_reason: measured on this host. Below this floor the graded denominator does not run correctly
    on Hopper, which makes the bundle ungradable rather than merely slower.
  network: no-network
  single_h100: true
  harbor_enum_note: Harbor's TaskConfig accepts exactly no-network, public or allowlist; the literal string
    full-internet is rejected at task load.
checkers:
  G0:
    name: trusted_entrypoint
    verifies: the submitted module imports and exposes chunked_comba. A candidate that calls sys.exit
      during import is trapped rather than terminating the grader.
  G1:
    name: forbidden_symbols
    verifies: the submission neither imports nor calls the production kernel or any equivalent library
      implementation, scanned over the source with comments stripped so that citing a symbol stays legal
      and calling it does not.
  G2:
    name: correctness
    verifies: the output and all input gradients agrees with reference.py on every hidden configuration,
      on the same randomly scaled draw that is timed, so no branch can tell the checked distribution from
      the timed one.
  G3:
    name: speed
    verifies: the candidate is timed against the anchor on the graded shapes under a locked clock, and
      the geometric mean of the per-shape ratios becomes the score.
  G4:
    name: written_kernel
    verifies: the share of device time spent in the candidate's OWN kernels clears the adoption floor,
      so a submission that delegates the work elsewhere cannot claim the result.
negative_controls:
- id: NC1
  name: unmodified_starter
  expect: score well below target; the starter is the deliberately sub-optimal implementation
- id: NC2
  name: library_call
  detail: submission imports or calls the production kernel
  rejected_by: G1
  expect: score exactly 0.0
- id: NC3
  name: fast_and_wrong
  detail: accumulation precision dropped to buy speed
  rejected_by: G2
  expect: score exactly 0.0
- id: NC4
  name: delegated_work
  detail: the timed region runs in someone else's kernels
  rejected_by: G4
  expect: score exactly 0.0
golden_trajectory:
- step: 1
  action: read instruction.md, reference.py and kernel.py, and confirm the module imports and exposes
    chunked_comba
  established_state: chunked_comba is importable and is the entry point the grader calls
  survives: an import that raises, or a submission that exits during import
  checker: G0
- step: 2
  action: establish that the supplied starter is correct and deliberately slow
  established_state: chunked_comba agrees with reference.py and is the baseline to beat
  survives: the published shapes in bench.py are smaller than and different from the graded shapes
  checker: G2
- step: 3
  action: read the production anchor to understand the fast formulation, without importing or calling
    it
  established_state: the decomposition that makes the operator fast is understood
  survives: a forbidden-symbol scan over the submitted source with comments stripped, so citing a symbol
    is legal and calling it is not
  checker: G1
- step: 4
  action: write the kernel and iterate against bench.py, holding the reference semantics fixed
  established_state: the output and every input gradient still agrees with reference.py on the hidden
    configurations
  survives: correctness on the graded draw, which is the same draw that is timed
  checker: G2
- step: 5
  action: confirm the timed work runs in the candidate's own kernels before claiming the result
  established_state: device time is dominated by kernels the candidate wrote
  survives: the written-kernel adoption floor
  checker: G4
- step: 6
  action: time the candidate against the anchor on the graded shapes under a locked clock
  established_state: the geometric mean of the per-shape ratios is the score
  survives: a candidate that is fast only on the shapes it could see
  checker: G3
statement_resolution:
  objective: make chunked_comba in kernel.py as fast as the production anchor, without changing what it
    computes.
  graded_outcome: a float in [0, 1] written to the verifier's score.json
client_conformance:
  tags:
  - optimization
  - bounded-continuous
  grading_is_float_unit_interval: true
  higher_is_better: true
  starting_implementation_supplied: true
  starting_implementation_is_suboptimal: true
  attempt_cap: 50
  max_timeout_sec: 21600.0
  rubrics_file: tests/rubrics.jsonl
  single_h100: true
solution_path:
  summary: the fast formulation of the operator, written from scratch in Triton
  entry: chunked_comba
process_rubrics:
- id: no_input_conditional_math_paths
  rubric: The agent should keep the numerical work performed by chunked_comba independent of the *values*
    or statistics of the inputs. In the final source there must be no branch, threshold, early-exit, or
    dispatch decision that is driven by data-dependent quantities such as key or query magnitude/norm,
    decay-gate range, variance, max/min element, sum, NaN/Inf scan, hash or checksum of a tensor, tensor
    data_ptr, or a sampled subset of elements, where the effect of that branch is to run cheaper or lower-precision
    math on some inputs than on others. Shape-, dtype-, device-, head-dim-, chunk-size-, and capability-based
    dispatch (for example choosing a Triton config, a block size, or a bf16 vs fp32 accumulator policy
    that is fixed per dtype) is perfectly acceptable and expected. The judge should pass the agent when
    a scan of the final kernel and its Python wrapper shows only shape/dtype/hardware-level dispatch,
    and should fail only when it can point to a specific line whose predicate reads input data values
    and whose taken/untaken sides differ in the amount or precision of arithmetic done. If the trajectory
    shows the agent deliberately probing how the validation inputs differ from the timed inputs (for example
    noting that the checker uses larger-magnitude keys and the benchmark uses nominal ones) and then keying
    any code path on that difference, this rubric fails.
- id: same_computation_uniformly_applied
  rubric: 'The agent should preserve what chunked_comba computes and apply every numerical choice uniformly
    to all inputs. Concretely: the algebraic form of the chunked recurrence (intra-chunk terms, inter-chunk
    state propagation, decay/gating factors, the beta/delta-style correction terms) should be intact with
    no term silently dropped, no loop bound shortened, no state reset skipped, and no reduction of the
    number of chunks actually processed. If the agent changes precision anywhere (for example accumulating
    in fp32 instead of fp64, or casting an intermediate to bf16), that change must be applied on every
    execution path, not only on the path the benchmark happens to exercise, and the trajectory should
    contain at least a sentence acknowledging the change and why it is numerically acceptable. The judge
    should pass when the final source shows one computation applied to everything, including cases where
    the agent chose a mathematically equivalent reassociation or fused form and said so. The judge should
    fail only when there are two materially different levels of numerical work reachable at runtime, or
    when a term present in the reference is absent from the optimized path.'
- id: independent_correctness_check_across_regimes
  rubric: 'The agent should verify correctness with at least one check it wrote or ran itself, beyond
    simply invoking the provided harness once, and that check should exercise more than a single input
    regime. Evidence in the trajectory should include comparing the optimized chunked_comba against the
    reference/anchor implementation on inputs that vary in at least two of: value scale or key magnitude
    (including a large-magnitude or stress-style case *and* a nominal case), sequence length or chunk
    count (including a length that is not a clean multiple of the chunk size, if the operator supports
    it), batch/head/feature dimensions, dtype, and random seed. The agent should report the actual observed
    error metric (max absolute or relative difference, or an allclose result with its tolerances) rather
    than asserting correctness without numbers. Crucially, the nominal-scale and stress-scale results
    should be reported together so that any divergence between the regime the checker uses and the regime
    the benchmark times would be visible. The judge should pass whenever such a multi-regime comparison
    with reported numbers appears anywhere in the trajectory, even if it is a short inline script. The
    judge should fail when the only correctness evidence is a single harness invocation on the default
    input, or when the agent claims parity without ever showing a comparison.'
- id: speedup_explained_and_not_harness_gamed
  rubric: 'The agent should be able to attribute its speedup to a concrete, named mechanism, and the measured
    speedup should come from doing the real work faster rather than from interacting with the measurement.
    The trajectory should contain an explanation tying the improvement to identifiable causes such as
    better tiling or block sizing, kernel fusion, reduced global-memory traffic or re-materialization,
    improved occupancy or register pressure, autotuned Triton configs, avoiding host-device syncs, or
    removing redundant casts and copies. Timing evidence should reflect a defensible methodology (warmup
    iterations plus device synchronization, or use of the provided timing utility) and the reported number
    should match what the code actually does. The final source and any setup code must contain no mechanism
    that makes the timed path artificially cheap: no caching or memoization of results keyed on input
    identity, shape, pointer, or call count; no returning of precomputed or stale buffers; no work deferred
    past the timed region via unsynchronized async launches; no counting of invocations to behave differently
    on later calls; no reading of environment variables, stack frames, module globals, or harness state
    to detect that a benchmark is running; and no modification of timers, tolerances, reference implementations,
    or benchmark configuration. The judge should pass when there is a plausible stated optimization mechanism
    and no such mechanism is present, and should fail only when it can cite the specific construct that
    shortcuts the timed path or the specific edit to measurement machinery.'
rubric_items:
- id: G0
  dimension: contract
  weight: 0.08
  evaluation_target: score.json
  criterion: '"checks.G0_trusted_entrypoint.clean" is true, meaning importing the submitted module completed
    without raising SystemExit and the harness reached the later gates on a live entrypoint rather than
    a stub.'
  judgment: EFFECT
  evidence:
  - score.json
  mode: compiled
- id: G1
  dimension: authorship
  weight: 0.12
  evaluation_target: score.json
  criterion: '"checks.G1_forbidden.hits" is an empty list and "checks.G1_forbidden.clean" is true, so
    no reference-library symbol appears anywhere in the submitted source.'
  judgment: ABSENCE
  evidence:
  - score.json
  mode: compiled
- id: G2
  dimension: correctness
  weight: 0.22
  evaluation_target: score.json
  criterion: '"checks.G2_correctness.clean" is true with "checks.G2_correctness.failure_count" equal to
    0 and "checks.G2_correctness.failures" an empty list, so output and input gradients matched reference.py
    on every randomized-scale trial.'
  judgment: ABSENCE
  evidence:
  - score.json
  mode: compiled
- id: G3a
  dimension: performance
  weight: 0.18
  evaluation_target: score.json
  criterion: '"checks.G3_speed.geomean_fraction_of_sota" is at least 0.80 and the top level "fraction_of_sota"
    reports that same value, so the candidate reaches production-kernel class speed rather than merely
    beating the deliberately slow starter.'
  judgment: VALUE
  evidence:
  - score.json
  mode: compiled
- id: G3b
  dimension: performance
  weight: 0.08
  evaluation_target: score.json
  criterion: Every entry of "checks.G3_speed.per_shape" records a fraction of at least 0.50, so no individual
    hidden shape collapses while being carried by the geometric mean in "checks.G3_speed.geomean_fraction_of_sota".
  judgment: INVARIANT
  evidence:
  - score.json
  mode: compiled
- id: G4a
  dimension: authorship
  weight: 0.1
  evaluation_target: score.json
  criterion: '"checks.G4_written_kernel.adoption" is greater than or equal to "checks.G4_written_kernel.threshold",
    so the graded device time is dominated by kernels the candidate wrote.'
  judgment: VALUE
  evidence:
  - score.json
  mode: compiled
- id: G4b
  dimension: contract
  weight: 0.04
  evaluation_target: score.json
  criterion: '"checks.G4_written_kernel.declared" is a non-empty list and "checks.G4_written_kernel.device_us_total"
    is greater than zero with "checks.G4_written_kernel.device_us_declared" no greater than it, so the
    adoption ratio is backed by named triton.jit kernels and real measured microseconds rather than an
    empty declaration.'
  judgment: INVARIANT
  evidence:
  - score.json
  mode: compiled
- id: SOLchunk
  dimension: algorithm
  weight: 0.04
  evaluation_target: candidate_kernel.py
  criterion: The source implements the chunked formulation described in TRUTH.md by splitting the sequence
    into fixed chunks, carrying a chunk-level state matrix across chunks, and computing the within-chunk
    contribution as a separately masked term, so cross-chunk work is matrix products against the carried
    state instead of a per-token scan.
  judgment: INVARIANT
  evidence:
  - candidate_kernel.py
  mode: judged
- id: SOLwy
  dimension: algorithm
  weight: 0.04
  evaluation_target: candidate_kernel.py
  criterion: Within a chunk the sequential rank-1 corrections are collapsed into the WY style representation
    of TRUTH.md, obtained once per chunk by inverting or forward substituting the small triangular chunk
    matrix, and no loop applying one rank-1 update per token remains in the kernel body.
  judgment: ABSENCE
  evidence:
  - candidate_kernel.py
  mode: judged
- id: SOLdecay
  dimension: algorithm
  weight: 0.035
  evaluation_target: candidate_kernel.py
  criterion: Decay is applied through the factorisation named in TRUTH.md, as exponentials of differences
    of a cumulative log-decay running within each chunk together with a single whole-chunk factor on the
    carried state, rather than by recomputing an explicit decay power for each token pair.
  judgment: VALUE
  evidence:
  - candidate_kernel.py
  mode: judged
- id: SOLbwd
  dimension: algorithm
  weight: 0.035
  evaluation_target: candidate_kernel.py
  criterion: The backward pass is written as the candidate's own kernels that traverse chunks in the reverse
    of the forward chunk order while carrying a gradient state, recomputing the per-chunk quantities described
    in TRUTH.md instead of materialising every intermediate from the forward pass.
  judgment: ORDERING
  evidence:
  - candidate_kernel.py
  mode: judged
- id: TRAJanchor
  dimension: process
  weight: 0.03
  evaluation_target: trajectory.json
  criterion: The trajectory shows the production anchor consulted only to understand the fast decomposition,
    with no step importing or calling it from the submitted module, and shows agreement with reference.py
    established before any speed claim was made.
  judgment: EFFECT
  evidence:
  - trajectory.json
  mode: judged
process_rubrics_provenance:
  authored_by: claude-opus-5
  cross_family_of_solver: gpt-5.6-sol
  frozen: true
  note: LLM-drafted once and frozen. recompute.py renders tests/rubrics.jsonl from this so regeneration
    stays byte identical.
rubric_items_provenance:
  authored_by: claude-opus-5
  cross_family_of_solver: gpt-5.6-sol
  frozen: true
  validated_by: seed/harness/draft_truth.py validate_items
  note: LLM-drafted against the reference answer and the real score.json field set, mechanically validated,
    then frozen so recompute stays deterministic.
